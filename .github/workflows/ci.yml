name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Dummy values so agents construct; ALLOW_MODEL_REQUESTS=False blocks real calls.
      CLAUSEGUARD_PROVIDER: groq
      GROQ_API_KEY: ci-dummy-key
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (mypy)
        run: uv run mypy
        continue-on-error: true  # informational for now; tighten as types stabilize

      - name: Tests + eval math (pytest)
        run: uv run pytest -q
